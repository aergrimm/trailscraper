name: Automatic Trail Scraper

on:
  schedule:
    # Draait elke nacht om 02:00 UTC (cron-schedule)
    - cron: '0 2 * * *'
  # Maakt het ook mogelijk om de scraper handmatig via de GitHub knop uit te voeren
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # <-- NOODZAKELIJK: geeft GitHub Actions rechten om issues aan te maken!

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen uit Git
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests feedgen icalendar python-dateutil

      - name: Scraper uitvoeren
        run: python main.py

      - name: Automatisch resultaten opslaan in Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Met -f dwing je Git om het geïgnoreerde events.json bestand toch toe te voegen
          git add -f events.json
          git add data/geocode_cache.json
          git diff-index --quiet HEAD || git commit -m "chore: automatische update van events.json en geocode_cache"
          git push

      - name: Controleer op geocoding issues
        id: check_geocoding
        run: |
          if [ -f geocoding_issues.txt ]; then
            echo "has_geocoding_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_geocoding_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Maak GitHub Issue bij Geocoding Fouten
        if: steps.check_geocoding.outputs.has_geocoding_issues == 'true'
        uses: dacbd/create-issue-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Geocoding waarschuwing: Coordinaten ontbreken
          body-path: geocoding_issues.txt
          assignees: aergrimm