<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailrun Kalender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="trail-container">
    
    <!-- Filterbalk -->
    <div class="filter-container">
      
      <!-- Rij 1: Zoekterm, Vertrekplaats & Maand -->
      <div class="filter-row">
        <div class="filter-group">
          <label for="search-input">Zoeken:</label>
          <input type="text" id="search-input" placeholder="Zoek op titel of locatie...">
        </div>

        <div class="filter-group">
          <label for="user-location">Afstand berekenen vanaf:</label>
          <input type="text" id="user-location" value="Utrecht" placeholder="Bijv. Utrecht, Amsterdam...">
        </div>

        <div class="filter-group">
          <label for="month-filter">Maand:</label>
          <select id="month-filter">
            <option value="all">Alle maanden</option>
            <!-- Wordt automatisch gevuld door app.js -->
          </select>
        </div>
      </div>

      <!-- Rij 2: Afstand Checkboxes & Snelknoppen -->
      <div class="filter-row checkbox-row">
        <span class="filter-label">Afstanden:</span>
        <div class="checkbox-group">
          <label><input type="checkbox" class="dist-checkbox" value="short" checked> Kort (&lt; 15 km)</label>
          <label><input type="checkbox" class="dist-checkbox" value="medium" checked> Middel (15 - 30 km)</label>
          <label><input type="checkbox" class="dist-checkbox" value="long" checked> Lang (&gt; 30 km)</label>
        </div>
        
        <div class="btn-group">
          <button type="button" id="btn-select-all" class="btn-select">Alles aan</button>
          <button type="button" id="btn-deselect-all" class="btn-select">Alles uit</button>
        </div>
      </div>

    </div>

    <!-- Container voor evenementen -->
    <div id="events-container"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
