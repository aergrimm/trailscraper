<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailrun Kalender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="trail-container">
    
    <!-- Filterbalk -->
    <div class="filter-container">
      
      <!-- Rij 1: Zoeken & Maand -->
      <div class="filter-row">
        <div class="filter-group flex-2">
          <label for="search-input">Zoeken:</label>
          <input type="text" id="search-input" placeholder="Zoek op titel of locatie...">
        </div>

        <div class="filter-group flex-1">
          <label for="month-filter">Maand:</label>
          <select id="month-filter">
            <option value="all">Alle maanden</option>
            <!-- Automatisch gevuld door app.js -->
          </select>
        </div>
      </div>

      <!-- Rij 2: Vertrekplaats & Max. Reisafstand -->
      <div class="filter-row">
        <div class="filter-group flex-2">
          <label for="user-location">Vertrekplaats:</label>
          <input type="text" id="user-location" value="Utrecht" placeholder="Bijv. Utrecht, Amsterdam...">
        </div>

        <div class="filter-group flex-1">
          <label for="travel-dist-filter">Max. reisafstand:</label>
          <select id="travel-dist-filter">
            <option value="all">Alle afstanden</option>
            <option value="50">&lt; 50 km</option>
            <option value="100">&lt; 100 km</option>
          </select>
        </div>
      </div>

      <!-- Blok 3: Afstanden -->
      <div class="filter-block">
        <div class="filter-block-header">
          <span class="filter-label">Afstanden:</span>
          <button type="button" id="btn-toggle-dist" class="btn-toggle">Alles uit</button>
        </div>
        <div class="checkbox-group">
          <label><input type="checkbox" class="dist-checkbox" value="under_15" checked> &lt; 15 km</label>
          <label><input type="checkbox" class="dist-checkbox" value="up_to_25" checked> 15-25 km</label>
          <label><input type="checkbox" class="dist-checkbox" value="up_to_42" checked> 26-42 km</label>
          <label><input type="checkbox" class="dist-checkbox" value="over_42" checked> &gt; 42 km</label>
        </div>
      </div>

      <!-- Blok 4: Provincies (4 kolommen) -->
      <div class="filter-block">
        <div class="filter-block-header">
          <span class="filter-label">Provincies:</span>
          <button type="button" id="btn-toggle-prov" class="btn-toggle">Alles uit</button>
        </div>
        <div class="checkbox-group province-grid-4">
          <label><input type="checkbox" class="prov-checkbox" value="Drenthe" checked> Drenthe</label>
          <label><input type="checkbox" class="prov-checkbox" value="Flevoland" checked> Flevoland</label>
          <label><input type="checkbox" class="prov-checkbox" value="Friesland" checked> Friesland</label>
          <label><input type="checkbox" class="prov-checkbox" value="Gelderland" checked> Gelderland</label>
          <label><input type="checkbox" class="prov-checkbox" value="Groningen" checked> Groningen</label>
          <label><input type="checkbox" class="prov-checkbox" value="Limburg" checked> Limburg</label>
          <label><input type="checkbox" class="prov-checkbox" value="Noord-Brabant" checked> Noord-Brabant</label>
          <label><input type="checkbox" class="prov-checkbox" value="Noord-Holland" checked> Noord-Holland</label>
          <label><input type="checkbox" class="prov-checkbox" value="Overijssel" checked> Overijssel</label>
          <label><input type="checkbox" class="prov-checkbox" value="Utrecht" checked> Utrecht</label>
          <label><input type="checkbox" class="prov-checkbox" value="Zeeland" checked> Zeeland</label>
          <label><input type="checkbox" class="prov-checkbox" value="Zuid-Holland" checked> Zuid-Holland</label>
          <label class="full-width-item"><input type="checkbox" class="prov-checkbox" value="Buitenland" checked> Overig / Buitenland</label>
        </div>
      </div>

    </div>

    <!-- Container voor evenementen (Grid layout) -->
    <div id="events-container" class="events-grid"></div>

  </div>
	<button id="scrollToTopBtn" class="scroll-to-top" aria-label="Naar Boven">↑</button>
  <script src="app.js"></script>
</body>
</html>
