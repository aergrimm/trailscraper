<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailrun Kalender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="trail-container">
    
    <!-- Filterbalk -->
    <div class="filter-container">
      <div class="filter-group">
        <input type="text" id="search-input" placeholder="Zoek op titel of locatie...">
      </div>

      <div class="filter-group">
        <select id="distance-filter">
          <option value="all">Alle afstanden</option>
          <option value="short">Kort (&lt; 15 km)</option>
          <option value="medium">Middel (15 - 30 km)</option>
          <option value="long">Lang (&gt; 30 km)</option>
        </select>
      </div>

      <div class="filter-group">
        <select id="month-filter">
          <option value="all">Alle maanden</option>
          <option value="2026-04">April 2026</option>
          <option value="2026-05">Mei 2026</option>
          <option value="2026-06">Juni 2026</option>
          <option value="2026-07">Juli 2026</option>
          <option value="2026-08">Augustus 2026</option>
          <option value="2026-09">September 2026</option>
          <option value="2026-10">Oktober 2026</option>
          <option value="2026-11">November 2026</option>
          <option value="2026-12">December 2026</option>
        </select>
      </div>
    </div>

    <!-- Container voor evenementen -->
    <div id="events-container"></div>

  </div>

  <!-- JavaScript koppeling -->
  <script src="app.js"></script>
</body>
</html>
