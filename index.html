<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailrun Kalender Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="trail-filter-box">
    <!-- 1. Afstand v.a. Woonplaats -->
    <div class="filter-group">
      <label>📍 Maximale reisafstand v.a. Woonplaats:</label>
      <div class="filter-row">
        <input type="text" id="userLocation" value="Utrecht" placeholder="Bijv. Utrecht">
        <select id="maxRadius" onchange="filterEvents()">
          <option value="9999" selected>Alle afstanden</option>
          <option value="25">&lt; 25 km</option>
          <option value="50">&lt; 50 km</option>
          <option value="75">&lt; 75 km</option>
          <option value="100">&lt; 100 km</option>
        </select>
        <button type="button" onclick="updateUserCoordinates(event)">Bereken Afstand</button>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 15px 0;">

    <!-- 2. Provincie Checkboxes -->
    <div class="filter-group">
      <div class="filter-group-header">
        <label>🗺️ Selecteer Provincies:</label>
        <button type="button" id="toggleProvincesBtn" class="btn-toggle-all" onclick="toggleAllProvinces()">Alles uitvinken</button>
      </div>
      <div class="province-grid" id="provinceCheckboxes"></div>
    </div>

    <!-- 3. Maand, Trail Afstand & Zoekbalk -->
    <div class="filter-row">
      <div>
        <label for="monthFilter" style="display:block; font-weight:bold; margin-bottom:4px;">Maand:</label>
        <select id="monthFilter" onchange="filterEvents()">
          <option value="all">Alle maanden</option>
        </select>
      </div>
      <div>
        <label for="distanceFilter" style="display:block; font-weight:bold; margin-bottom:4px;">Trail Afstand:</label>
        <select id="distanceFilter" onchange="filterEvents()">
          <option value="all">Alle afstanden</option>
          <option value="short">Kort (&lt; 15 km)</option>
          <option value="medium">Middel (15 - 30 km)</option>
          <option value="long">Lang (30 - 50 km)</option>
          <option value="ultra">Ultra (50+ km)</option>
        </select>
      </div>
      <div>
        <label for="searchFilter" style="display:block; font-weight:bold; margin-bottom:4px;">Zoeken:</label>
        <input type="text" id="searchFilter" onkeyup="filterEvents()" placeholder="Zoek op naam of plaats...">
      </div>
    </div>
  </div>

  <div id="trailEventsList">Laden van trailrun evenementen...</div>

  <script src="app.js"></script>
</body>
</html>
